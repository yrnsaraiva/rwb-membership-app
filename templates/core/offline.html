{% extends "base.html" %}
{% block title %}Sem ligação{% endblock %}
{% block content %}
<div class="min-h-[60vh] grid place-items-center text-center">
  <div>
    <div class="mx-auto w-16 h-16 rounded-full bg-surface2 border border-line grid place-items-center text-muted mb-5">{% include "icons/wifi-off.svg" with cls="w-7 h-7" %}</div>
    <h1 class="text-3xl font-semibold">Sem rede</h1>
    <p class="text-muted mt-2 max-w-xs mx-auto">Parece que estás sem ligação. Assim que a rede voltar, tenta novamente.</p>
    <button type="button" onclick="location.reload()" class="btn btn-primary mt-6">Tentar novamente</button>
  </div>
</div>
{% endblock %}

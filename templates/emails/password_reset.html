{% extends "emails/_layout.html" %}
{% block body %}
<h1 style="font-family:Oswald,Arial Narrow,Arial,sans-serif;text-transform:uppercase;color:#fff;font-size:24px;margin:0 0 12px;">Recuperar acesso</h1>
<p>Olá {{ user.first_name }}, recebemos um pedido para redefinir a palavra-passe da tua conta.</p>
<p style="margin:24px 0;"><a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}" style="background:#FABB00;color:#0B0B0B;padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:600;">Definir nova palavra-passe</a></p>
<p style="color:#9a9aa2;font-size:13px;">Se não foste tu, ignora este email — a tua conta continua segura.</p>
{% endblock %}
